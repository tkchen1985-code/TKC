<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5efe4">
  <title>人民幣成本換算</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #24302a;
      --muted: #6f786f;
      --paper: rgba(255, 253, 248, 0.88);
      --line: #ded8cb;
      --green: #1f6750;
      --green-dark: #174c3c;
      --accent: #dc7655;
      --shadow: 0 24px 70px rgba(53, 55, 45, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      color: var(--ink);
      font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(220, 118, 85, 0.17), transparent 28rem),
        radial-gradient(circle at 85% 75%, rgba(31, 103, 80, 0.14), transparent 30rem),
        #f5efe4;
    }

    main {
      width: min(100%, 520px);
      padding: clamp(26px, 6vw, 48px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    h1 {
      margin: 0;
      font-family: "Songti TC", "Noto Serif TC", serif;
      font-size: clamp(2rem, 8vw, 3.25rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 12px 0 32px;
      color: var(--muted);
      line-height: 1.7;
    }

    .field { margin-top: 22px; }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    input, select {
      width: 100%;
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 15px;
      outline: none;
      color: var(--ink);
      background: #fffdf9;
      font: inherit;
      font-size: 1.08rem;
      transition: border-color 160ms, box-shadow 160ms, transform 160ms;
    }

    input {
      padding: 0 56px 0 17px;
      font-variant-numeric: tabular-nums;
    }

    select {
      padding: 0 44px 0 17px;
      cursor: pointer;
    }

    input:focus, select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(31, 103, 80, 0.11);
    }

    input[readonly] {
      color: var(--green);
      font-weight: 800;
      background: #f2f6f1;
      cursor: default;
    }

    .suffix {
      position: absolute;
      top: 50%;
      right: 17px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    #customField[hidden] { display: none; }

    .margin-equation {
      margin: 8px 2px 0;
      color: var(--muted);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }

    .result {
      margin-top: 30px;
      padding: 24px;
      overflow: hidden;
      border-radius: 20px;
      color: white;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      box-shadow: 0 14px 30px rgba(31, 103, 80, 0.2);
    }

    .result-label {
      margin: 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    output {
      display: block;
      margin-top: 5px;
      overflow-wrap: anywhere;
      font-size: clamp(2.2rem, 10vw, 3.8rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
    }

    .equation {
      min-height: 1.5em;
      margin: 10px 0 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
    }

    .reset {
      display: block;
      margin: 18px auto 0;
      border: 0;
      color: var(--muted);
      background: transparent;
      font: inherit;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .reset:hover { color: var(--ink); }

    @media (max-width: 420px) {
      main { border-radius: 22px; }
      .intro { margin-bottom: 26px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">COST CALCULATOR</p>
    <h1>人民幣成本換算</h1>
    <p class="intro">輸入成本與倍率，結果會自動算好。</p>

    <form id="calculator" autocomplete="off">
      <div class="field">
        <label for="cost">人民幣成本</label>
        <div class="input-wrap">
          <input id="cost" name="cost" type="number" min="0" step="any" inputmode="decimal" placeholder="例如：100" autofocus>
          <span class="suffix">¥</span>
        </div>
      </div>

      <div class="field">
        <label for="rate">換算倍率</label>
        <select id="rate" name="rate">
          <option value="13">13</option>
          <option value="13.5">13.5</option>
          <option value="14">14</option>
          <option value="custom">自己輸入數值</option>
        </select>
      </div>

      <div class="field" id="customField" hidden>
        <label for="customRate">自訂倍率</label>
        <div class="input-wrap">
          <input id="customRate" name="customRate" type="number" min="0" step="any" inputmode="decimal" placeholder="輸入倍率">
          <span class="suffix">×</span>
        </div>
      </div>

      <div class="field">
        <label for="grossMargin">成本率（人民幣匯率以 5 計算）</label>
        <div class="input-wrap">
          <input id="grossMargin" type="text" value="38.46" readonly aria-describedby="marginEquation">
          <span class="suffix">%</span>
        </div>
        <p class="margin-equation" id="marginEquation">1 ÷（13 ÷ 5）＝ 38.46%</p>
      </div>

      <section class="result" aria-live="polite">
        <p class="result-label">換算結果</p>
        <output id="result">—</output>
        <p class="equation" id="equation">請先輸入人民幣成本</p>
      </section>

      <button class="reset" id="reset" type="button">清除並重新計算</button>
    </form>
  </main>

  <script>
    const cost = document.querySelector("#cost");
    const rate = document.querySelector("#rate");
    const customRate = document.querySelector("#customRate");
    const customField = document.querySelector("#customField");
    const grossMargin = document.querySelector("#grossMargin");
    const marginEquation = document.querySelector("#marginEquation");
    const result = document.querySelector("#result");
    const equation = document.querySelector("#equation");
    const reset = document.querySelector("#reset");

    const numberFormat = new Intl.NumberFormat("zh-TW", {
      maximumFractionDigits: 2
    });

    function selectedRate() {
      return rate.value === "custom"
        ? Number.parseFloat(customRate.value)
        : Number.parseFloat(rate.value);
    }

    function calculate() {
      const costValue = Number.parseFloat(cost.value);
      const rateValue = selectedRate();
      const hasCost = Number.isFinite(costValue) && costValue >= 0;
      const hasRate = Number.isFinite(rateValue) && rateValue > 0;

      if (hasRate) {
        const margin = 1 / (rateValue / 5);
        const marginPercent = margin * 100;
        grossMargin.value = numberFormat.format(marginPercent);
        marginEquation.textContent =
          `1 ÷（${numberFormat.format(rateValue)} ÷ 5）＝ ${numberFormat.format(marginPercent)}%`;
      } else {
        grossMargin.value = "—";
        marginEquation.textContent = "請輸入大於 0 的自訂倍率";
      }

      if (!hasCost || !hasRate) {
        result.textContent = "—";
        equation.textContent = !hasCost
          ? "請先輸入人民幣成本"
          : "請輸入自訂倍率";
      } else {
        const total = costValue * rateValue;
        result.textContent = numberFormat.format(total);
        equation.textContent =
          `${numberFormat.format(costValue)} × ${numberFormat.format(rateValue)} = ${numberFormat.format(total)}`;
      }

      localStorage.setItem("rmb-calculator", JSON.stringify({
        cost: cost.value,
        rate: rate.value,
        customRate: customRate.value
      }));
    }

    function toggleCustomRate() {
      const isCustom = rate.value === "custom";
      customField.hidden = !isCustom;
      if (isCustom && !customRate.value) customRate.focus();
      calculate();
    }

    function restore() {
      try {
        const saved = JSON.parse(localStorage.getItem("rmb-calculator"));
        if (!saved) return;
        cost.value = saved.cost ?? "";
        rate.value = saved.rate ?? "13";
        customRate.value = saved.customRate ?? "";
        customField.hidden = rate.value !== "custom";
        calculate();
      } catch {
        localStorage.removeItem("rmb-calculator");
      }
    }

    cost.addEventListener("input", calculate);
    customRate.addEventListener("input", calculate);
    rate.addEventListener("change", toggleCustomRate);
    reset.addEventListener("click", () => {
      cost.value = "";
      rate.value = "13";
      customRate.value = "";
      customField.hidden = true;
      localStorage.removeItem("rmb-calculator");
      calculate();
      cost.focus();
    });

    restore();
    calculate();
  </script>
</body>
</html>
