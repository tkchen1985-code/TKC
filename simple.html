<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5efe4"><title>人民幣成本換算</title>
<style>
:root{color-scheme:light;--ink:#24302a;--muted:#6f786f;--line:#ded8cb;--green:#1f6750}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 18px;color:var(--ink);font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;background:radial-gradient(circle at 15% 20%,rgba(220,118,85,.17),transparent 28rem),radial-gradient(circle at 85% 75%,rgba(31,103,80,.14),transparent 30rem),#f5efe4}main{width:min(100%,520px);padding:clamp(26px,6vw,48px);border:1px solid rgba(255,255,255,.8);border-radius:28px;background:rgba(255,253,248,.88);box-shadow:0 24px 70px rgba(53,55,45,.14);backdrop-filter:blur(16px)}.eyebrow{margin:0 0 10px;color:#dc7655;font-size:.75rem;font-weight:800;letter-spacing:.18em}h1{margin:0;font-family:"Songti TC","Noto Serif TC",serif;font-size:clamp(2rem,8vw,3.25rem);font-weight:700;line-height:1.08;letter-spacing:-.04em}.intro{margin:12px 0 32px;color:var(--muted);line-height:1.7}.field{margin-top:22px}label{display:block;margin-bottom:9px;font-size:.92rem;font-weight:700}.input-wrap{position:relative}input,select{width:100%;min-height:58px;border:1px solid var(--line);border-radius:15px;outline:none;color:var(--ink);background:#fffdf9;font:inherit;font-size:1.08rem}input{padding:0 56px 0 17px;font-variant-numeric:tabular-nums}select{padding:0 44px 0 17px;cursor:pointer}input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(31,103,80,.11)}input[readonly]{color:var(--green);font-weight:800;background:#f2f6f1}.suffix{position:absolute;top:50%;right:17px;color:var(--muted);transform:translateY(-50%);pointer-events:none}[hidden]{display:none!important}.margin-equation{margin:8px 2px 0;color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}.result{margin-top:30px;padding:24px;overflow:hidden;border-radius:20px;color:white;background:linear-gradient(135deg,var(--green),#174c3c);box-shadow:0 14px 30px rgba(31,103,80,.2)}.result-label{margin:0;color:rgba(255,255,255,.72);font-size:.8rem;font-weight:700;letter-spacing:.12em}output{display:block;margin-top:5px;overflow-wrap:anywhere;font-size:clamp(2.2rem,10vw,3.8rem);font-weight:800;line-height:1.15;letter-spacing:-.035em;font-variant-numeric:tabular-nums}.equation{min-height:1.5em;margin:10px 0 0;color:rgba(255,255,255,.72);font-size:.88rem}.reset{display:block;margin:18px auto 0;border:0;color:var(--muted);background:transparent;font:inherit;font-size:.88rem;cursor:pointer}.reset:hover{color:var(--ink)}@media(max-width:420px){main{border-radius:22px}.intro{margin-bottom:26px}}
</style></head><body><main><p class="eyebrow">COST CALCULATOR</p><h1>人民幣成本換算</h1><p class="intro">輸入成本與倍率，結果會自動算好。</p>
<form id="calculator" autocomplete="off"><div class="field"><label for="cost">人民幣單件成本</label><div class="input-wrap"><input id="cost" name="cost" type="number" min="0" step="any" inputmode="decimal" placeholder="例如：100" autofocus><span class="suffix">¥</span></div></div>
<div class="field"><label for="rate">定價倍率</label><select id="rate" name="rate"><option value="13">13</option><option value="13.5">13.5</option><option value="14">14</option><option value="custom">自己輸入數值</option></select></div>
<div class="field" id="customField" hidden><label for="customRate">自訂倍率</label><div class="input-wrap"><input id="customRate" name="customRate" type="number" min="0" step="any" inputmode="decimal" placeholder="輸入倍率"><span class="suffix">×</span></div></div>
<div class="field"><label for="costRatio">成本率（人民幣匯率以 5 計算）</label><div class="input-wrap"><input id="costRatio" type="text" value="38.46" readonly aria-describedby="marginEquation"><span class="suffix">%</span></div><p class="margin-equation" id="marginEquation">1 ÷（13 ÷ 5）＝ 38.46%</p></div>
<section class="result" aria-live="polite"><p class="result-label">換算結果（台幣售價）</p><output id="result">—</output><p class="equation" id="equation">請先輸入人民幣成本</p></section><button class="reset" id="reset" type="button">清除並重新計算</button></form></main>
<script>
const $=id=>document.getElementById(id),cost=$('cost'),rate=$('rate'),customRate=$('customRate'),numberFormat=new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2});
function selectedRate(){return Number.parseFloat(rate.value==='custom'?customRate.value:rate.value)}
function calculate(){const c=Number.parseFloat(cost.value),r=selectedRate(),validCost=Number.isFinite(c)&&c>=0,validRate=Number.isFinite(r)&&r>0;const percent=5/r*100;$('costRatio').value=validRate?numberFormat.format(percent):'—';$('marginEquation').textContent=validRate?'1 ÷（'+numberFormat.format(r)+' ÷ 5）＝ '+numberFormat.format(percent)+'%':'請輸入大於 0 的自訂倍率';const total=c*r;if(validCost&&validRate&&Number.isFinite(total)){$('result').textContent=numberFormat.format(total);$('equation').textContent=numberFormat.format(c)+' × '+numberFormat.format(r)+' = '+numberFormat.format(total)}else{$('result').textContent='—';$('equation').textContent=!validCost?'請先輸入人民幣成本':'請輸入有效的正數倍率'}try{localStorage.setItem('rmb-calculator',JSON.stringify({cost:cost.value,rate:rate.value,customRate:customRate.value}))}catch{}}
function toggleCustomRate(){$('customField').hidden=rate.value!=='custom';if(rate.value==='custom'&&!customRate.value)customRate.focus();calculate()}
try{const saved=JSON.parse(localStorage.getItem('rmb-calculator'));if(saved){cost.value=saved.cost??'';rate.value=['13','13.5','14','custom'].includes(saved.rate)?saved.rate:'13';customRate.value=saved.customRate??'';$('customField').hidden=rate.value!=='custom'}}catch{}
$('calculator').addEventListener('submit',e=>e.preventDefault());cost.addEventListener('input',calculate);customRate.addEventListener('input',calculate);rate.addEventListener('change',toggleCustomRate);$('reset').addEventListener('click',()=>{cost.value='';rate.value='13';customRate.value='';$('customField').hidden=true;calculate();cost.focus()});calculate();
</script></body></html>
